server.port=8080

# ---- MySQL (override with environment variables) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}


# Tables are created/updated automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
# Secret must be at least 32 characters. CHANGE IT in production.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}